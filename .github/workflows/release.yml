name: Release zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the plugin compiles
        run: python -m compileall -q QGeo3D
      - name: Build the plugin zip
        run: python scripts/build_zip.py
      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QGeo3D-*.zip
